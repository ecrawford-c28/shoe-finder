# Keeps prices, stock and the women's product mapping current.
#
# The SportsShoes feed is around 413MB and changes daily. Pulling it on a page
# request would be absurd, and Vercel's function limits would not allow it
# anyway, so it happens here instead: download, reduce to the ~11KB the site
# needs, commit only if something actually changed.
#
# Requires one repository secret, SPORTSSHOES_FEED_URL, which is the Performance
# Horizon feed link. It is a credential: anyone holding it can pull the feed, so
# it lives in encrypted secrets and never in the repo.

name: Refresh SportsShoes feed

on:
  schedule:
    # 04:12 UTC. Off the hour on purpose: scheduled jobs pile up on the hour and
    # get queued, and nothing here is time critical.
    - cron: '12 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the feed
        env:
          FEED_URL: ${{ secrets.SPORTSSHOES_FEED_URL }}
        run: |
          if [ -z "$FEED_URL" ]; then
            echo "SPORTSSHOES_FEED_URL is not set. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          curl -fsSL --compressed --retry 3 --retry-delay 10 --max-time 900 -o /tmp/feed.raw "$FEED_URL"
          # Performance Horizon serves this feed as a ZIP containing one CSV,
          # whatever the URL extension suggests, and the member inside is named
          # something like <hash>.csv_445519.tmp. The file is identified by its
          # magic bytes rather than by its name or content type, because both
          # lie here: the URL ends .csv and the payload is a zip archive.
          MAGIC=$(head -c 4 /tmp/feed.raw | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            504b0304*)
              echo "Response is a zip archive, extracting."
              unzip -p /tmp/feed.raw > /tmp/feed.csv
              ;;
            1f8b*)
              echo "Response is gzip, decompressing."
              gunzip -c /tmp/feed.raw > /tmp/feed.csv
              ;;
            *)
              echo "Response looks like plain text."
              mv /tmp/feed.raw /tmp/feed.csv
              ;;
          esac
          rm -f /tmp/feed.raw
          ls -la /tmp/feed.csv

      - name: Sanity check the download
        run: |
          # A truncated or error-page download must not be allowed to wipe the
          # site's stock data, so refuse anything that is not plausibly the feed.
          SIZE=$(stat -c%s /tmp/feed.csv)
          ROWS=$(wc -l < /tmp/feed.csv)
          echo "feed is $SIZE bytes across $ROWS rows"
          echo "first line: $(head -c 120 /tmp/feed.csv)"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "Feed is implausibly small for a full catalogue. Refusing to regenerate."
            exit 1
          fi
          head -1 /tmp/feed.csv | grep -q '"id","title"' || {
            echo "Header does not look like the product feed. Refusing to regenerate."
            exit 1
          }

      # The sheet is the editorial source, so it comes first. Both repo copies
      # of the database are written from it rather than maintained by hand,
      # which is what let them drift a hundred shoes apart.
      - name: Sync the database from the Google Sheet
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || 'https://docs.google.com/spreadsheets/d/1R9-ztEhQpq8MRl5VPdtn5YcQyqqoMBUrpc4yvFLDT2w/export?format=csv' }}
        run: |
          python3 nmfr/scripts/sync-sheet.py \
            "$SHEET_CSV_URL" \
            nmfr/running-shoes-database.csv \
            nmfr/data/fallback.js

      - name: Regenerate the data file
        run: |
          python3 nmfr/scripts/extract-feed.py \
            /tmp/feed.csv \
            nmfr/running-shoes-database.csv \
            nmfr/data/feed.js \
            nmfr/data/sizes.js

      # Which running shoes the retailer sells that the database does not carry.
      # Written here because the feed is already downloaded and nothing else in
      # the day has a copy of it. The baseline file is what keeps the list to
      # arrivals rather than six hundred shoes that were always there.
      - name: List the running shoes we do not carry yet
        run: |
          python3 nmfr/scripts/new-models.py \
            /tmp/feed.csv \
            nmfr/running-shoes-database.csv \
            nmfr/public/new-models.csv \
            nmfr/data/new-models-baseline.csv

      - name: Refuse a result that would empty the site
        run: |
          MATCHED=$(grep -o '"matched": [0-9]*' nmfr/data/feed.js | head -1 | grep -o '[0-9]*')
          echo "matched $MATCHED shoes"
          if [ "${MATCHED:-0}" -lt 40 ]; then
            echo "Only $MATCHED shoes matched. That is too few to be real, so nothing is committed."
            exit 1
          fi

      - name: Commit if anything changed
        run: |
          git config user.name "shoefinder-bot"
          git config user.email "noreply@github.com"
          # Both files, not just the first. Which sizes are in stock can change
          # while the count stays the same, so checking feed.js alone would
          # leave the deals pages stale for a day.
          # The database copies too, not just the feed output: a shoe added to
          # the sheet has to reach the repo or the next run matches the old
          # list all over again.
          FILES="nmfr/data/feed.js nmfr/data/sizes.js nmfr/running-shoes-database.csv nmfr/data/fallback.js nmfr/public/new-models.csv nmfr/data/new-models-baseline.csv"
          if git diff --quiet -- $FILES; then
            echo "Prices, stock, sizes and the database are all unchanged. Nothing to commit."
            exit 0
          fi
          git add $FILES
          git commit -m "Refresh prices and stock from the SportsShoes feed"
          git push
